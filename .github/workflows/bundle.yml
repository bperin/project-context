name: Bundle and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

  bundle:
    name: Bundle CLI
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install esbuild
        run: npm install --save-dev esbuild

      - name: Bundle CLI
        run: |
          npx esbuild bin/cli.js \
            --bundle \
            --platform=node \
            --format=cjs \
            --outfile=dist/project-context \
            --keep-names
          chmod +x dist/project-context

      - name: Verify bundle
        run: |
          node dist/project-context --help | head -5
          echo "Bundle size: $(du -h dist/project-context | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-context-bundle
          path: dist/project-context
          retention-days: 30
